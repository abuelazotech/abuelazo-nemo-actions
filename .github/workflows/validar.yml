name: Validar

on: [push, pull_request]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y shellcheck desktop-file-utils lintian python3 python3-gi imagemagick
      - name: Verificar sintaxis de shell
        run: |
          bash -n build.sh
          for script in src/bin/*; do bash -n "$script"; done
      - name: Analizar scripts
        run: shellcheck -s bash -S warning -e SC1090 src/bin/* src/lib/*.sh build.sh
      - name: Verificar Python
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python3 -m py_compile src/config/abuelazo-nemo-config
      - name: Probar catálogo
        run: python3 tests/test_catalog.py
      - name: Probar scripts A
        run: ./tests/test_scripts_a.sh
      - name: Probar scripts B
        run: ./tests/test_scripts_b.sh
      - name: Probar aplicación completa
        run: python3 tests/test_funcional.py
      - name: Habilitar construcción
        run: chmod +x build.sh
      - name: Construir paquete
        run: ./build.sh
